[project]
name = "vibe"
# Releases are versioned by git tags at sprint close (HANDOFF.md, "Versions"), not here.
version = "0.0.0"
description = "Vibe Editing Agent backend: edit video by chatting with an agent that calls typed editing tools."
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=19.0",
    "fastapi>=0.115",
    "numpy>=2.5",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

# PyTorch for running models locally (F-08; README "Backend"). Off by default, so CPU laptops and
# CI never download it. Pick one: `uv sync --extra cpu` (any OS, incl. Apple MPS) or
# `uv sync --extra cu128` (NVIDIA, driver 570+; needed for RTX 50 / Blackwell).
[project.optional-dependencies]
cpu = ["torch>=2.7", "torchvision>=0.22"]
cu128 = ["torch>=2.7", "torchvision>=0.22"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
