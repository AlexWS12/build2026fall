name: frontend

on:
  push:
    branches: [main]
    # The mock API imports the contract's example states, so a change there can break the UI.
    paths: ["frontend/**", "backend/src/vibe/contract/examples/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "backend/src/vibe/contract/examples/**", ".github/workflows/frontend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
